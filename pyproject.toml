[project]
name = "xcg-internal"
version = "0.1.0"
description = "XC Gradient internal website and Discord adapter"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "fastapi",
    "httpx",
    "notion-client",
    "python-dotenv",
    "pytz",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.uv]
package = false
